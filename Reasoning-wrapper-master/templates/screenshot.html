<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screenshot</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    canvas { display: block; cursor: crosshair; }
    #overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); pointer-events: none; z-index: 1; }
    #selection { position: absolute; border: 2px dashed #fff; background: rgba(255,255,255,0.1); pointer-events: none; z-index: 2; display: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div id="selection"></div>
  <canvas id="canvas"></canvas>

  <script>
    const { ipcRenderer } = require('electron');

    async function init() {
      // Allow user to escape immediately even if getMedia fails
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') ipcRenderer.send('capture-cancel');
      });

      try {
        const sourceId = await ipcRenderer.invoke('get-desktop-stream-id');
        if (!sourceId) {
            ipcRenderer.send('capture-cancel');
            return;
        }
        
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            mandatory: {
              chromeMediaSource: 'desktop',
              chromeMediaSourceId: sourceId,
              minWidth: window.innerWidth,
              maxWidth: window.innerWidth,
              minHeight: window.innerHeight,
              maxHeight: window.innerHeight
            }
          }
        });
      
      const video = document.createElement('video');
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        
        // Draw the frame once to capture the screen
        setTimeout(() => {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          stream.getTracks().forEach(t => t.stop());
          setupSelection(canvas, ctx);
        }, 100);
      };
      } catch (err) {
        console.error("Screen capture failed:", err);
        // Alert the main process so it can close this frozen window
        ipcRenderer.send('capture-cancel');
      }
    }

    function setupSelection(canvas, ctx) {
      let isDrawing = false;
      let startX, startY;
      const selection = document.getElementById('selection');

      document.addEventListener('mousedown', (e) => {
        isDrawing = true;
        startX = e.clientX;
        startY = e.clientY;
        selection.style.left = startX + 'px';
        selection.style.top = startY + 'px';
        selection.style.width = '0px';
        selection.style.height = '0px';
        selection.style.display = 'block';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const currentX = e.clientX;
        const currentY = e.clientY;
        selection.style.left = Math.min(startX, currentX) + 'px';
        selection.style.top = Math.min(startY, currentY) + 'px';
        selection.style.width = Math.abs(currentX - startX) + 'px';
        selection.style.height = Math.abs(currentY - startY) + 'px';
      });

      document.addEventListener('mouseup', (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        selection.style.display = 'none';

        const endX = e.clientX;
        const endY = e.clientY;
        const x = Math.min(startX, endX);
        const y = Math.min(startY, endY);
        const w = Math.abs(endX - startX);
        const h = Math.abs(endY - startY);

        if (w > 10 && h > 10) {
          const cropCanvas = document.createElement('canvas');
          cropCanvas.width = w;
          cropCanvas.height = h;
          const cropCtx = cropCanvas.getContext('2d');
          cropCtx.drawImage(canvas, x, y, w, h, 0, 0, w, h);
          const base64 = cropCanvas.toDataURL('image/png');
          ipcRenderer.send('capture-complete', base64);
        } else {
          ipcRenderer.send('capture-cancel');
        }
      });
    }

    init();
  </script>
</body>
</html>
