<div id="custom-prompt-modal">
    <div class="modal-card" style="width:min(400px, 95vw); height:auto; padding-bottom: 8px;">
      <div class="modal-header">
        <h3 id="custom-prompt-title" style="margin:0; font-size:1.1rem;">Prompt</h3>
      </div>
      <div class="modal-body" style="display:flex; flex-direction:column; gap: 12px; margin-bottom:0;">
        <input type="text" id="custom-prompt-input" style="width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:8px; border-radius:6px; font-size:1rem;">
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button id="custom-prompt-cancel" class="hdr-btn">Cancel</button>
          <button id="custom-prompt-ok" class="hdr-btn" style="background:var(--primary-glow); border-color:var(--primary);">OK</button>
        </div>
      </div>
    </div>
  </div>
